apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: infer-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
---
# Critical inference on the queue's guaranteed GPU: non-preemptible.
apiVersion: batch/v1
kind: Job
metadata:
  name: infer
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        kai.scheduler/queue: poc2-infer
        priorityClassName: inference
    spec:
      schedulerName: kai-scheduler
      restartPolicy: Never
      securityContext:
        runAsUser: 2572
        runAsGroup: 2572
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: infer-gpu
      containers:
        - name: infer
          image: vllm/vllm-openai:v0.32.0
          workingDir: /sadata/nikkothari/kai-scheduler-lab
          command: ["python3", "serve/infer.py"]
          env:
            - name: HOME
              value: /sadata/nikkothari/kai-scheduler-lab/.cache/home
            # uid 2572 has no user entry in the image, and torch needs a username
            - name: USER
              value: nikkothari
            - name: HF_HUB_OFFLINE
              value: "1"
          resources:
            claims:
              - name: gpu
          volumeMounts:
            - name: sadata
              mountPath: /sadata/nikkothari
      volumes:
        - name: sadata
          persistentVolumeClaim:
            claimName: req-688-nikkothari-sadata-pvc
---
# Extra inference on the 6 surplus GPUs. KAI only lets preemptible workloads go over quota.
apiVersion: batch/v1
kind: Job
metadata:
  name: infer-burst
spec:
  parallelism: 6
  completions: 6
  backoffLimit: 0
  template:
    metadata:
      labels:
        kai.scheduler/queue: poc2-infer
        priorityClassName: build-preemptible
    spec:
      schedulerName: kai-scheduler
      restartPolicy: Never
      securityContext:
        runAsUser: 2572
        runAsGroup: 2572
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: infer-gpu
      containers:
        - name: infer
          image: vllm/vllm-openai:v0.32.0
          workingDir: /sadata/nikkothari/kai-scheduler-lab
          command: ["python3", "serve/infer.py"]
          env:
            - name: HOME
              value: /sadata/nikkothari/kai-scheduler-lab/.cache/home
            # uid 2572 has no user entry in the image, and torch needs a username
            - name: USER
              value: nikkothari
            - name: HF_HUB_OFFLINE
              value: "1"
          resources:
            claims:
              - name: gpu
          volumeMounts:
            - name: sadata
              mountPath: /sadata/nikkothari
      volumes:
        - name: sadata
          persistentVolumeClaim:
            claimName: req-688-nikkothari-sadata-pvc
