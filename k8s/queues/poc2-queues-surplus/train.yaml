apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: train-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
---
apiVersion: batch/v1
kind: Job
metadata:
  name: train
spec:
  backoffLimit: 100
  template:
    metadata:
      labels:
        kai.scheduler/queue: poc2-train
        priorityClassName: train
    spec:
      schedulerName: kai-scheduler
      restartPolicy: Never
      securityContext:
        runAsUser: 2572
        runAsGroup: 2572
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: train-gpu
      containers:
        - name: train
          image: vllm/vllm-openai:v0.32.0
          workingDir: /sadata/nikkothari/kai-scheduler-lab/train
          command: ["/sadata/nikkothari/default/bin/torchrun", "--nproc_per_node=1", "train.py"]
          env:
            - name: HOME
              value: /sadata/nikkothari/kai-scheduler-lab/.cache/home
            # uid 2572 has no user entry in the image, and torch needs a username
            - name: USER
              value: nikkothari
            - name: HF_HUB_OFFLINE
              value: "1"
          resources:
            claims:
              - name: gpu
          volumeMounts:
            - name: sadata
              mountPath: /sadata/nikkothari
      volumes:
        - name: sadata
          persistentVolumeClaim:
            claimName: req-688-nikkothari-sadata-pvc
