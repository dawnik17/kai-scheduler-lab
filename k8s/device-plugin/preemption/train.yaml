apiVersion: batch/v1
kind: Job
metadata:
  name: train
spec:
  backoffLimit: 100
  template:
    metadata:
      labels:
        kai.scheduler/queue: poc1
        priorityClassName: train
    spec:
      schedulerName: kai-scheduler
      restartPolicy: Never
      securityContext:
        runAsUser: 2572
        runAsGroup: 2572
      containers:
        - name: train
          image: vllm/vllm-openai:v0.32.0
          workingDir: /sadata/nikkothari/kai-scheduler-lab/train
          command: ["/sadata/nikkothari/default/bin/torchrun", "--nproc_per_node=4", "train.py"]
          env:
            - name: HOME
              value: /sadata/nikkothari/kai-scheduler-lab/.cache/home
            # uid 2572 has no user entry in the image, and torch needs a username
            - name: USER
              value: nikkothari
            - name: HF_HUB_OFFLINE
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: 4
          volumeMounts:
            - name: sadata
              mountPath: /sadata/nikkothari
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: sadata
          persistentVolumeClaim:
            claimName: req-708-nikkothari-sadata-pvc
        # NCCL needs more shared memory than the 64 MB a pod gets by default
        - name: shm
          emptyDir:
            medium: Memory
